<svg id="domains-database-v5-record-stack-outline" xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="outline-title outline-description">
  <title id="outline-title">Domains Database — labeled record stack outline</title>
  <desc id="outline-description">Three navy outlined tabbed records labeled .Com, .Org, and .Net from top to bottom, beside the Domains Database wordmark.</desc>
  <g id="outline-record-mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="outline-com-record" d="M47 51h141l22 24v35H47V51Z" stroke="#133B50" stroke-width="10" />
    <path id="outline-org-record" d="M47 116h141l22 24v35H47v-59Z" stroke="#133B50" stroke-width="10" />
    <path id="outline-net-record" d="M47 181h141l22 24v35H47v-59Z" stroke="#133B50" stroke-width="10" />
    <circle id="outline-com-dot" cx="178" cy="81" r="8" fill="#19AEAB" stroke="none" />
    <circle id="outline-org-dot" cx="178" cy="146" r="8" fill="#19AEAB" stroke="none" />
    <circle id="outline-net-dot" cx="178" cy="211" r="8" fill="#19AEAB" stroke="none" />
  </g>
  <g id="outline-domain-labels" fill="#138B8B" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.8">
    <text id="outline-com-label" x="70" y="90">.Com</text>
    <text id="outline-org-label" x="70" y="155">.Org</text>
    <text id="outline-net-label" x="70" y="220">.Net</text>
  </g>
  <g id="outline-wordmark" font-family="Avenir Next, Inter, Arial, sans-serif">
    <text id="outline-domains-word" x="273" y="130" fill="#133B50" font-size="66" font-weight="800" letter-spacing="-3">Domains</text>
    <text id="outline-database-word" x="273" y="198" fill="#133B50" font-size="66" font-weight="800" letter-spacing="-3">Database</text>
    <text id="outline-tagline" x="278" y="234" fill="#138B8B" font-size="15" font-weight="750" letter-spacing="4">EVERY ADDRESS IN ORDER</text>
  </g>
</svg>
