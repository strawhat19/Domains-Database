t-weight="600" fill="#138b8b" text-anchor="middle">.dev</text><line x1="595" y1="423" x2="865" y2="489" stroke="#89aaa0" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 9"/><rect x="865" y="452" width="156" height="75" rx="18" fill="#fffefa" stroke="#c6d8cd" stroke-width="2"/><text x="943" y="501" font-size="37" font-weight="600" fill="#133b50" text-anchor="middle">.io</text><line x1="595" y1="423" x2="704" y2="620" stroke="#89aaa0" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 9"/><rect x="704" y="583" width="156" height="75" rx="18" fill="#fffefa" stroke="#c6d8cd" stroke-width="2"/><text x="782" y="632" font-size="37" font-weight="600" fill="#a47b39" text-anchor="middle">.us</text><line x1="595" y1="423" x2="519" y2="626" stroke="#89aaa0" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 9"/><rect x="426" y="589" width="156" height="75" rx="18" fill="#fffefa" stroke="#c6d8cd" stroke-width="2"/><text x="504" y="638" font-size="37" font-weight="600" fill="#a47b39" text-anchor="middle">.co</text><circle cx="595" cy="423" r="30" fill="#e4c07d"/><text x="595" y="433" font-size="18" font-weight="700" fill="#133b50" text-anchor="middle">www</text>
