  <g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round"><text x="84" y="82" font-size="15" font-weight="600" fill="#5f7b81" letter-spacing="2.2">DOMAINS DATABASE / FIELD GUIDE</text><text x="84" y="143" font-size="42" font-weight="650" fill="#133b50">Give every domain a place</text><rect x="145" y="213" width="910" height="424" rx="26" fill="#fffefa" stroke="#cbdcd3" stroke-width="2"/><rect x="145" y="213" width="236" height="424" rx="26" fill="#133b50"/><rect x="350" y="213" width="31" height="424" rx="0" fill="#133b50"/><text x="179" y="265" font-size="15" font-weight="700" fill="#afcfcd" letter-spacing="2">PORTFOLIO</text><rect x="164" y="280" width="195" height="56" rx="12" fill="#28576a"/><path d="M 184 294 h 12 l 6 5 h 15 v 20 h -33 z" fill="none" stroke="#8bbfc0" stroke-width="2"/><text x="229" y="314" font-size="19" font-weight="500" fill="#fffefa">All domains</text><path d="M 184 366 h 12 l 6 5 h 15 v 20 h -33 z" fill="none" stroke="#8bbfc0" stroke-width="2"/><text x="229" y="386" font-size="19" font-weight="500" fill="#fffefa">Renewals</text><path d="M 184 438 h 12 l 6 5 h 15 v 20 h -33 z" fill="none" stroke="#8bbfc0" stroke-width="2"/><text x="229" y="458" font-size="19" font-weight="500" fill="#fffefa">Projects</text><path d="M 184 510 h 12 l 6 5 h 15 v 20 h -33 z" fill="none" stroke="#8bbfc0" stroke-width="2"/><text x="229" y="530" font-size="19" font-weight="500" fill="#fffefa">Watchlist</text><text x="418" y="270" font-size="14" font-weight="600" fill="#5f7b81" letter-spacing="1.5">DOMAIN</text><text x="805" y="270" font-size="14" font-weight="600" fill="#5f7b81" letter-spacing="1.5">NEXT ACTION</text><line x1="414" y1="305" x2="1017" y2="305" stroke="#dee6dd" stroke-width="1" stroke-linecap="round"/><circle cx="435" cy="344" r="15" fill="#dfefea"/><text x="471" y="353" font-size="24" font-weight="600" fill="#133b50">atlas.example</text><rect x="804" y="324" width="155" height="43" rx="21" fill="#dfefea"/><text x="881" y="352" font-size="13" font-weight="700" fill="#138b8b" letter-spacing="1.3" text-anchor="middle">RENEW</text><line x1="414" y1="406" x2="1017" y2="406" stroke="#dee6dd" stroke-width="1" stroke-linecap="round"/><circle cx="435" cy="445" r="15" fill="#dfefea"/><text x="471" y="454" font-size="24" font-weight="600" fill="#133b50">fieldnote.example</text><rect x="804" y="425" width="155" height="43" rx="21" fill="#f4e7ce"/><text x="881" y="453" font-size="13" font-weight="700" fill="#aa7c35" letter-spacing="1.3" text-anchor="middle">REVIEW</text><line x1="414" y1="507" x2="1017" y2="507" stroke="#dee6dd" stroke-width="1" stroke-linecap="round"/><circle cx="435" cy="546" r="15" fill="#dfefea"/><text x="471" y="555" font-size="24" font-weight="600" fill="#133b50">northline.example</text><rect x="804" y="526" width="155" height="43" rx="21" fill="#dfefea"/><text x="881" y="554" font-size="13" font-weight="700" fill="#5f7b81" letter-spacing="1.3" text-anchor="middle">KEEP</text><circle cx="1052" cy="601" r="37" fill="#138b8b"/><line x1="1038" y1="601" x2="1066" y2="601" stroke="#fffefa" stroke-width="3" stroke-linecap="round"/><line x1="1052" y1="587" x2="1052" y2="615" stroke="#fffefa" stroke-width="3" stroke-linecap="round"/>
