<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">The domain expiration and release lifecycle</title>
  <desc id="desc">A five-step timeline from registered through expires, grace, redemption, and released, with a note that timing and recovery rules vary by registry.</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#9ab4ae" opacity="0.2"/></pattern>
  </defs>
  <rect width="1200" height="750" fill="#f5f3e9"/>
  <circle cx="1148" cy="12" r="285" fill="#dfefea" opacity="0.68"/>
  <circle cx="-5" cy="714" r="228" fill="#ede8d8" opacity="0.75"/>
  <rect x="780" y="408" width="356" height="252" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round"><text x="84" y="82" font-size="15" font-weight="600" fill="#5f7b81" letter-spacing="2.2">DOMAINS DATABASE / FIELD GUIDE</text><text x="84" y="143" font-size="42" font-weight="650" fill="#133b50">Understand the path to release</text><rect x="91" y="232" width="1018" height="390" rx="26" fill="#fffefa" stroke="#cbdcd3" stroke-width="2"/><text x="134" y="286" font-size="15" font-weight="600" fill="#5f7b81" letter-spacing="1.9">THE DOMAIN LIFECYCLE</text><line x1="173" y1="391" x2="1012" y2="391" stroke="#d9e4d9" stroke-width="8" stroke-linecap="round"/><line x1="173" y1="391" x2="593" y2="391" stroke="#138b8b" stroke-width="8" stroke-linecap="round"/><circle cx="173" cy="391" r="27" fill="#138b8b" stroke="#138b8b" stroke-width="3"/><text x="173" y="399" font-size="22" font-weight="700" fill="#fffefa" text-anchor="middle">1</text><text x="173" y="460" font-size="22" font-weight="600" fill="#133b50" text-anchor="middle">Registered</text><text x="173" y="494" font-size="17" font-weight="500" fill="#5f7b81" text-anchor="middle">Active use</text><circle cx="383" cy="391" r="27" fill="#138b8b" stroke="#138b8b" stroke-width="3"/><text x="383" y="399" font-size="22" font-weight="700" fill="#fffefa" text-anchor="middle">2</text><text x="383" y="460" font-size="22" font-weight="600" fill="#133b50" text-anchor="middle">Expires</text><text x="383" y="494" font-size="17" font-weight="500" fill="#5f7b81" text-anchor="middle">Renewal due</text><circle cx="593" cy="391" r="27" fill="#138b8b" stroke="#138b8b" stroke-width="3"/><text x="593" y="399" font-size="22" font-weight="700" fill="#fffefa" text-anchor="middle">3</text><text x="593" y="460" font-size="22" font-weight="600" fill="#133b50" text-anchor="middle">Grace</text><text x="593" y="494" font-size="17" font-weight="500" fill="#5f7b81" text-anchor="middle">Check options</text><circle cx="803" cy="391" r="27" fill="#f5f3e9" stroke="#b1c7bd" stroke-width="3"/><text x="803" y="399" font-size="22" font-weight="700" fill="#5f7b81" text-anchor="middle">4</text><text x="803" y="460" font-size="22" font-weight="600" fill="#133b50" text-anchor="middle">Redemption</text><text x="803" y="494" font-size="17" font-weight="500" fill="#5f7b81" text-anchor="middle">Recovery phase</text><circle cx="1012" cy="391" r="27" fill="#f5f3e9" stroke="#b1c7bd" stroke-width="3"/><text x="1012" y="399" font-size="22" font-weight="700" fill="#5f7b81" text-anchor="middle">5</text><text x="1012" y="460" font-size="22" font-weight="600" fill="#133b50" text-anchor="middle">Released</text><text x="1012" y="494" font-size="17" font-weight="500" fill="#5f7b81" text-anchor="middle">May be available</text><rect x="324" y="540" width="552" height="49" rx="24" fill="#dfefea"/><circle cx="352" cy="564" r="10" fill="#138b8b"/><text x="352" y="570" font-size="16" font-weight="700" fill="#fffefa" text-anchor="middle">i</text><text x="379" y="573" font-size="19" font-weight="500" fill="#133b50">Timing and recovery rules vary by registry</text><path d="M 970 305 l 20 0 l -9 -9 M 990 305 l -9 9" fill="none" stroke="#138b8b" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="692" x2="1116" y2="692" stroke="#ccd8cc" stroke-width="1" stroke-linecap="round"/>
    <text x="84" y="724" font-size="13" font-weight="600" fill="#5f7b81" letter-spacing="2">DOMAIN NOTES</text>
    <text x="1116" y="724" font-size="13" font-weight="600" fill="#5f7b81" letter-spacing="1.5" text-anchor="end">04 / 06</text>
  </g>
</svg>
