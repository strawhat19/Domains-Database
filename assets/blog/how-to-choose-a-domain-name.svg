"532" y="602" font-size="26" font-weight="600" fill="#133b50">Memorable</text><rect x="769" y="544" width="296" height="101" rx="18" fill="#fffefa" stroke="#d3dfd6" stroke-width="2"/><circle cx="812" cy="594" r="23" fill="#dfefea"/><text x="812" y="601" font-size="15" font-weight="700" fill="#138b8b" text-anchor="middle">03</text><text x="849" y="602" font-size="26" font-weight="600" fill="#133b50">Distinct</text>
