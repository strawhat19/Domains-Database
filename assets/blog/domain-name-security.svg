<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Layered security for a domain name</title>
  <desc id="desc">A domain browser panel combines a lock and shield with three security layers: account access, registrar lock, and DNS checks.</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#9ab4ae" opacity="0.2"/></pattern>
  </defs>
  <rect width="1200" height="750" fill="#f5f3e9"/>
  <circle cx="1148" cy="12" r="285" fill="#dfefea" opacity="0.68"/>
  <circle cx="-5" cy="714" r="228" fill="#ede8d8" opacity="0.75"/>
  <rect x="780" y="408" width="356" height="252" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round"><text x="84" y="82" font-size="15" font-weight="600" fill="#5f7b81" letter-spacing="2.2">DOMAINS DATABASE / FIELD GUIDE</text><text x="84" y="143" font-size="42" font-weight="650" fill="#133b50">Protect the name you rely on</text><rect x="119" y="226" width="962" height="388" rx="24" fill="#fffefa" stroke="#ceddd6" stroke-width="2"/><rect x="120" y="227" width="960" height="58" rx="23" fill="#dfefea"/><rect x="120" y="254" width="960" height="30" rx="0" fill="#dfefea"/><circle cx="147" cy="255" r="6" fill="#e4c07d"/><circle cx="168" cy="255" r="6" fill="#9fbab0"/><circle cx="189" cy="255" r="6" fill="#138b8b"/><line x1="119" y1="284" x2="1081" y2="284" stroke="#ceddd6" stroke-width="2" stroke-linecap="round"/><text x="227" y="264" font-size="14" font-weight="600" fill="#5f7b81" letter-spacing="1.5">SECURE DOMAIN WORKSPACE</text><path d="M 335 337 l 115 39 v 93 q 0 90 -115 135 q -115 -45 -115 -135 v -93 Z" fill="#dfefea" stroke="#138b8b" stroke-width="4"/><path d="M 309 445 v -21 a 26 26 0 0 1 52 0 v 21" fill="none" stroke="#133b50" stroke-width="7" stroke-linecap="round"/><rect x="294" y="443" width="82" height="65" rx="12" fill="#133b50"/><circle cx="335" cy="465" r="7" fill="#fffefa"/><line x1="335" y1="470" x2="335" y2="485" stroke="#fffefa" stroke-width="5" stroke-linecap="round"/><rect x="534" y="345" width="489" height="66" rx="13" fill="#f5f3e9"/><circle cx="571" cy="378" r="14" fill="#138b8b"/><path d="M 564 378 l 5 5 l 9 -10" fill="none" stroke="#fffefa" stroke-width="3" stroke-linecap="round"/><text x="602" y="372" font-size="21" font-weight="600" fill="#133b50">Account access</text><text x="602" y="396" font-size="16" font-weight="500" fill="#5f7b81">Strong sign-in and recovery</text><rect x="534" y="426" width="489" height="66" rx="13" fill="#f5f3e9"/><circle cx="571" cy="459" r="14" fill="#138b8b"/><path d="M 564 459 l 5 5 l 9 -10" fill="none" stroke="#fffefa" stroke-width="3" stroke-linecap="round"/><text x="602" y="453" font-size="21" font-weight="600" fill="#133b50">Registrar lock</text><text x="602" y="477" font-size="16" font-weight="500" fill="#5f7b81">Manage transfer controls</text><rect x="534" y="507" width="489" height="66" rx="13" fill="#f5f3e9"/><circle cx="571" cy="540" r="14" fill="#138b8b"/><path d="M 564 540 l 5 5 l 9 -10" fill="none" stroke="#fffefa" stroke-width="3" stroke-linecap="round"/><text x="602" y="534" font-size="21" font-weight="600" fill="#133b50">DNS checks</text><text x="602" y="558" font-size="16" font-weight="500" fill="#5f7b81">Keep records accurate</text><circle cx="1031" cy="590" r="37" fill="#e4c07d"/><path d="M 1015 590 l 11 11 l 23 -24" fill="none" stroke="#133b50" stroke-width="5" stroke-linecap="round"/>
    <line x1="84" y1="692" x2="1116" y2="692" stroke="#ccd8cc" stroke-width="1" stroke-linecap="round"/>
    <text x="84" y="724" font-size="13" font-weight="600" fill="#5f7b81" letter-spacing="2">DOMAIN NOTES</text>
    <text x="1116" y="724" font-size="13" font-weight="600" fill="#5f7b81" letter-spacing="1.5" text-anchor="end">05 / 06</text>
  </g>
</svg>
