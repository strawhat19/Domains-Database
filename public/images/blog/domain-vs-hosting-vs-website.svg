    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 1 1 l 5 3 l -5 3" fill="none" stroke="#138b8b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
