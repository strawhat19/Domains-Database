<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">How a domain, hosting, a website, and DNS work together</title>
  <desc id="desc">A miniature neighborhood explains four parts of a website. A domain is the address on a street plaque, hosting is the space rented for the site shown as an outlined plot, the website is a house visitors explore, and DNS provides directions to the host.</desc>
